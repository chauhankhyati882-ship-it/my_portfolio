<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Portfolio</title>

  <style>
    body{
<button onclick="toggleDark()" class="btn">🌙 Dark Mode</button>
      margin:0;
      font-family: Arial;
      background: linear-gradient(120deg, #4facfe, #00f2fe);
      text-align:center;
      color: #fff;
    }

    header{
      padding: 30px;
      font-size: 28px;
      font-weight: bold;
    }

    .card{
      background: white;
      color: black;
      width: 80%;
      max-width: 500px;
      margin: auto;
      margin-top: 20px;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0px 5px 15px rgba(0,0,0,0.2);
    }

    img{
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      margin-top: 10px;
      border: 4px solid #4facfe;
    }

    h2{
      margin: 10px 0;
    }

    .btn{
      display: inline-block;
      padding: 10px 15px;
      margin: 10px;
      background: #4facfe;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    .btn:hover{
      background: #0077ff;
    }

    footer{
      margin-top: 20px;
      padding: 15px;
      font-size: 14px;
    }
<style>
header{
  padding: 30px;
  font-size: 28px;
  font-weight: bold;

  animation: slideDown 1s ease;
}

@keyframes slideDown{
  from{
    transform: translateY(-50px);
    opacity: 0;
  }
  to{
    transform: translateY(0);
    opacity: 1;
  }
}
</style>
<style>
.dark{
  background: #111;
  color: white;
}

.dark .card{
  background: #222;
  color: white;
}

.dark .btn{
  background: #444;
}
</style>
<style>
.card{
  animation: fadeIn 1.5s ease;
}

@keyframes fadeIn{
  from{
    opacity: 0;
    transform: scale(0.8);
  }
  to{
    opacity: 1;
    transform: scale(1);
  }
}
</style>
<style>
.btn{
  transition: 0.3s;
}

.btn:hover{
  transform: scale(1.1);
}
</style>
<style>
.card p{
  background: #f2f2f2;
  padding: 8px;
  border-radius: 6px;
  margin: 5px 0;
}
</style>
  </style>
</head>

<body>
<img src="khyati.jpeg" alt="My Photo">
<header>

</header>

<div class="card">

  

  <h2>Your Name</h2>
  <p>I am learning Web Development 💻</p>

  <h3>Skills</h3>

<div class="card">

  <p>🌐 Portfolio Website</p>

</div>

  <h3>Connect with me</h3>
  <a class="btn" href="https://instagram.com">Instagram</a>
  <a class="btn" href="#">GitHub</a>
  <a class="btn" href="#">LinkedIn</a>

</div>

<footer>
  © 2026 My Portfolio
</footer>
<script>
function toggleDark(){
  document.body.classList.toggle("dark");
}
</script>
</body>
</html>
